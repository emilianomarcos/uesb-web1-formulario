<html>
    <head>
        <title>Formulário</title>
    </head>
    <body>
        <h1>Formulário Completo</h1>

        <form action="">
            <fieldset>
                <legend><b>Dados Pessoais</b></legend>
                <label for="">Nome:
                    <input type="text" required>
                </label><br><br>
                
                <label for="">Sobrenome:
                    <input type="text" required>
                </label><br><br>
                
                <label for="">E-mail:
                    <input type="email" required>
                </label><br><br>
                
                <label for="">Data de Nascimento:
                    <input type="date" required>
                </label>
            </fieldset>

            <fieldset>
                <legend><b>Endereço</b></legend>
                <label for="">Rua:
                    <input type="text">
                </label><br><br>
                
                <label for="">Número:
                    <input type="text">
                </label><br><br>
                
                <label for="">Cidade:
                    <input type="text">
                </label><br><br>
                
                <label for="">Estado:
                    <input type="text">
                </label><br><br>
                
                <label for="">CEP:
                    <input type="text">
                </label>
            </fieldset>

        </form>
    </body>
</html>
