<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    
    <h1>Formulário Completo</h1>
    
    <form action="" method="post">
        <fieldset>
            <legend><b>Dados Pessoais</b></legend>
    
            <label>Nome:</label>
            <input type="text" required><br><br>
    
            <label>Sobrenome:</label>
            <input type="text" required><br><br>
    
            <label>E-mail:</label>
            <input type="email" required><br><br>
    
            <label>Data de Nascimento:</label>
            <input type="date" required>
    
        </fieldset>
    
        <fieldset>
            <legend><b>Endereço</b></legend>
    
            <label>Rua:</label>
            <input type="text" required><br><br>
    
            <label>Número:</label>
            <input type="text" required><br><br>
    
            <label>Cidade:</label>
            <input type="text" required><br><br>
    
            <label>Estado:</label>
            <input type="text" required><br><br>
    
            <label>CEP:</label>
            <input type="text" required>
    
        </fieldset>
    
        <fieldset>
            <legend><b>Preferências</b></legend>
    
            <label>Cor Favorita:</label>
            <select name="cor">
                <option value="nenhuma">Nenhuma</option>
                <option value="vermelho">Vermelho</option>
                <option value="azul">Azul</option>
                <option value="amarelo">Amarelo</option>
                <option value="verde">Verde</option>
                <option value="laranja">Laranja</option>
                <option value="roxo">Roxo</option>
                <option value="rosa">Rosa</option>
                <option value="marrom">Marrom</option>
                <option value="preto">Preto</option>
                <option value="cinza">Cinza</option>
                <option value="azulclaro">Azul Claro</option>
                <option value="verdeclaro">Verde Claro</option>
            </select><br><br>
    
            <label>Gênero:</label>
            <input type="radio" name="genero" value="feminino">Feminino
            <input type="radio" name="genero" value="masculino">Masculino<br><br>
    
            <label>Interesses:</label><br>
            <input type="checkbox" name="interesses" value="esportes">
            <label>Esportes</label><br>
    
            <input type="checkbox" name="interesses" value="musica">
            <label>Música</label><br>
    
            <input type="checkbox" name="interesses" value="tecnologia">
            <label>Tecnologia</label>
    
        </fieldset>
    
        <fieldset>
            <legend><b>Upload de Arquivos</legend>
    
            <label>Escolha um arquivo:</label>
            <input type="file" name="upload" accept="image/*,.pdf"><br><br>
        </fieldset>
    
        <fieldset>
            <legend><b>Informações de Login</b></legend>
    
            <label>Nome de Usuário:</label>
            <input type="text" required><br><br>
    
            <label>Senha:</label>
            <input type="password" required><br><br>
    
            <label>Confirmar Senha:</label>
            <input type="password" required>
        </fieldset>
    
        <input type="submit" value="Enviar">
    </form>
</body>
</html>
